<style>
:root{
  --void:#0b0512;--ink:#150a25;--ink2:#1f1035;
  --violet:#a54bff;--violet-deep:#6d28d9;--amber:#ffb22e;--gold:#ffd27a;--pink:#ff4fa3;
  --text:#f3eaff;--mute:#a897c8;--tag:#c78bff;--line:rgba(165,75,255,.24);
  --flame:conic-gradient(from 200deg,#ffb22e,#ff5fd2 26%,#a54bff 50%,#5b21b6 74%,#ffb22e);
  --edge:linear-gradient(155deg,rgba(196,110,255,.75),rgba(255,178,46,.42) 55%,rgba(109,40,217,.4));
  --ph:url("https://raw.githubusercontent.com/uuhjeike/Lucian-Vale/main/profile%20photo.jpg");
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--void);color-scheme:dark;-webkit-text-size-adjust:100%}
body{font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Nirmala UI","Hind Siliguri",Arial,sans-serif;color:var(--text);
  background:radial-gradient(110% 340px at 50% 0,#2b1248 0,transparent 100%),var(--void);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.f{fill:currentColor;stroke:none}
.wrap{max-width:680px;margin:0 auto;padding-bottom:calc(56px + env(safe-area-inset-bottom))}

/* profile header */
.cover{position:relative;height:150px;overflow:hidden;border-radius:0 0 24px 24px;background:var(--ink2)}
.cover::before{content:"";position:absolute;inset:-30px;background:var(--ph) center/cover;filter:blur(24px) saturate(1.4);transform:scale(1.15)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(60,20,110,.15),rgba(11,5,18,.88))}
.head{position:relative;padding:0 18px;margin-top:-58px}
.row{display:flex;align-items:flex-end;gap:14px}
.ava{position:relative;isolation:isolate;display:block;flex:none;width:118px;height:118px;border-radius:50%;padding:3px;background:var(--flame)}
.ava::after{content:"";position:absolute;inset:-6px;z-index:-1;border-radius:50%;background:var(--flame);filter:blur(18px);opacity:.55;animation:pulse 4.6s ease-in-out infinite}
.ava img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid var(--void);background:var(--ink)}
@keyframes pulse{50%{opacity:.9}}
.stats{display:flex;flex:1;justify-content:space-around;padding-bottom:10px;text-align:center}
.stats b{display:block;font-size:19px;line-height:1.2}
.stats span{font-size:13px;color:var(--mute)}
h1{margin-top:12px;font-size:23px;line-height:1.25;letter-spacing:-.01em}
.handle{color:var(--mute);font-size:15px}
.bio{margin-top:6px;font-size:15px}
.sharep{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:42px;border-radius:12px;font-weight:600;font-size:15px;border:1px solid transparent;
  background:linear-gradient(var(--void),var(--void)) padding-box,var(--edge) border-box}
.sharep:active{transform:scale(.985)}

/* tabs */
.tabs{position:sticky;top:0;z-index:5;display:flex;margin-top:18px;background:rgba(11,5,18,.94);border-bottom:1px solid var(--line)}
.tab{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:48px;color:var(--mute);font-size:13.5px;font-weight:600}
.tab[aria-selected=true]{color:#fff}
.tab[aria-selected=true]::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,var(--violet),var(--amber))}

/* feed */
.feed{display:grid;gap:14px;padding:14px 12px 0}
.post{border:1px solid transparent;border-radius:20px;overflow:hidden;background:linear-gradient(var(--ink),var(--ink)) padding-box,var(--edge) border-box;content-visibility:auto;contain-intrinsic-size:auto 460px}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px}
.ring{flex:none;width:40px;height:40px;border-radius:50%;padding:2px;background:var(--flame)}
.ring img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--ink)}
.top b{display:block;font-size:15px;line-height:1.25}
.top small{display:block;font-size:13px;color:var(--mute);line-height:1.3}
.tx{padding:0 14px 12px;font-size:15.5px;overflow-wrap:anywhere}
.tx .p{white-space:pre-wrap}
.tx .p+.tw,.tx .tw+.p{margin-top:10px}
.tx.bn{line-height:1.8}
.tx.clamp{max-height:9.2em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent)}
.more{margin:-4px 14px 12px;color:var(--gold);font-size:14px;font-weight:600}
.tag{color:var(--tag)}
.tx a{color:var(--gold)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tw table{border-collapse:collapse;min-width:100%;font-size:13.5px;line-height:1.4}
.tw.wide td,.tw.wide th{white-space:nowrap}
.tw th,.tw td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tw th{background:var(--ink2);color:var(--gold);white-space:nowrap}
.tw tr:last-child td{border-bottom:0}
.tw td:first-child{min-width:5.5em}

/* media */
.media{position:relative;background:#07030d;overflow:hidden}
.ph{min-height:260px;background:linear-gradient(100deg,#150a25 30%,#26104a 50%,#150a25 70%) 0 0/220% 100%;animation:sh 1.5s linear infinite}
@keyframes sh{to{background-position:-220% 0}}
.pic{display:block;width:100%;height:auto;max-height:82vh;object-fit:contain;cursor:zoom-in}
.gal .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.gal .track::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:var(--ar,4/5);max-height:80vh;display:grid;place-items:center}
.sl.ph{min-height:0}
.sl img{width:100%;height:100%;object-fit:contain;cursor:zoom-in;-webkit-user-drag:none}
.cnt{position:absolute;top:10px;right:10px;padding:3px 10px;border-radius:99px;background:rgba(11,5,18,.72);font-size:13px;font-weight:600;pointer-events:none}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12);pointer-events:none}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--amber));transition:width .15s}
.nv{display:none;position:absolute;top:50%;width:38px;height:38px;margin-top:-19px;border-radius:50%;place-items:center;background:rgba(11,5,18,.72)}
.nv.pv{left:10px}.nv.nx{right:10px}
@media(hover:hover){.gal:hover .nv{display:grid}.gal.first .pv,.gal.last .nx{display:none}}
.vid{aspect-ratio:9/16;max-height:82vh;width:100%;cursor:pointer}
.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.pp{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;display:none;place-items:center;border-radius:50%;background:rgba(11,5,18,.62);border:1px solid var(--line);pointer-events:none}
.pp .ic{width:26px;height:26px;margin-left:3px}
.vid.paused .pp,.pp.on{display:grid}
.snd{position:absolute;right:10px;bottom:12px;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:rgba(11,5,18,.72)}
.yt{aspect-ratio:16/9}
.yt button,.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.yt img{width:100%;height:100%;object-fit:cover;display:block}
.bad{min-height:150px;display:grid;place-items:center}
.vid.bad{aspect-ratio:auto}
.bad .pp,.bad .snd{display:none}
.bad img,.bad video{display:none}
.oops{padding:16px;text-align:center;color:var(--gold);font-size:14px}
.lk{display:flex;align-items:center;gap:12px;margin:0 14px 12px;padding:12px;border-radius:14px;text-decoration:none;background:var(--ink2);border:1px solid var(--line)}
.lkb{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:20px;background:linear-gradient(135deg,var(--violet-deep),var(--violet) 60%,var(--amber))}
.lkt{flex:1;min-width:0}
.lkt b{display:block;font-size:15px}
.lkt small{display:block;color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;align-items:center;gap:2px;padding:6px 8px 8px}
.acts>*{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--text)}
.acts .like.on{color:var(--pink)}
.acts .like.on .ic{fill:currentColor;animation:pop .28s ease-out}
@keyframes pop{40%{transform:scale(1.28)}}
.acts .ob{margin-left:auto;color:var(--mute)}
.end{padding:22px 0 0;text-align:center;color:var(--mute);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);max-width:88vw;padding:10px 16px;border-radius:12px;background:var(--ink2);border:1px solid var(--line);font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;overflow-wrap:anywhere}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(6,2,12,.95)}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb button{position:absolute;width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:rgba(31,16,53,.85)}
.lb .x{top:calc(12px + env(safe-area-inset-top));right:12px}
.lb .lp{left:10px;top:50%;margin-top:-23px}.lb .ln{right:10px;top:50%;margin-top:-23px}
.lb .lc{position:absolute;top:calc(20px + env(safe-area-inset-top));left:16px;font-size:14px;font-weight:600}

@media(min-width:700px){.cover{border-radius:0 0 28px 28px}.feed{padding:16px 0 0}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(()=>{
'use strict';
/* ---------- profile + posts (edit here) ---------- */
const RAW='https://raw.githubusercontent.com/uuhjeike/Lucian-Vale/main/';
const PHOTO=RAW+'profile%20photo.jpg';
const ME={name:'Lucian Vale'};
/* Post = {x: text, d: folder inside repo, m: [[type, value], ...]}
   types: i = photo file, v = video file, y = YouTube id, l = external link */
const POSTS=[{"x":"আমি বার বার বলি অন্যেরবয়ফ্রেন্ড নিয়ে টানাটানি করিস বান্ধবী,, এখন বোঝ ঠেলা😂🫣 #reelsviralighligh #tendingreels #foryoupageシ #highlight #nonfollowers #hightlight #typ #reelsvira #relatively #support @highlight","m":[["v","Post/1000/1000/AQO2NKMTOZfX1AqBEg3MeHPQ3kGQOq61czANW1TpBSxJDzDlfOLB6AXgKwhWK5nTLPKCQX6po6svJT_NFb6uvRSSR-_D-CGYBawHgNgewn1LhA.mp4"]]},{"x":"Yes. If by “everything camera phone” you mean a phone that combines normal high-quality photography + huge zoom + ultrawide + macro + night vision/IR + thermal imaging + good video + rugged body, the list changes dramatically from a normal flagship-camera ranking.\n\nThere is no single phone that has literally every camera technology at the highest level. In particular, thermal and infrared/night-vision cameras are usually found on rugged specialist phones, while the best conventional photography is generally on flagship phones. Current 2026 products show that trade-off clearly.\n\n🌍 Top 10 “Everything Camera” Phones — 2026\n\n#\tPhone\tNormal camera\tNight vision / IR\tThermal\tZoom\tVideo\n\n1\tUlefone Armor 28 Ultra Thermal\t⭐⭐⭐⭐⭐\t⭐⭐⭐⭐\t✅\t⭐⭐⭐⭐\t⭐⭐⭐⭐\n2\tUlefone Armor 29 Pro Thermal\t⭐⭐⭐⭐\t⭐⭐⭐⭐\t✅\t⭐⭐⭐\t⭐⭐⭐⭐\n3\t8849 TANK 5 Pro\t⭐⭐⭐⭐\t⭐⭐⭐⭐\t✅\t⭐⭐⭐⭐\t⭐⭐⭐⭐\n4\tUlefone Armor 34\t⭐⭐⭐\t⭐⭐⭐⭐⭐\t❌\t⭐⭐⭐\t⭐⭐⭐⭐\n5\tSamsung Galaxy S26 Ultra\t⭐⭐⭐⭐⭐\t❌\t❌\t⭐⭐⭐⭐⭐\t⭐⭐⭐⭐⭐\n6\tHuawei Pura 80 Ultra\t⭐⭐⭐⭐⭐\t❌\t❌\t⭐⭐⭐⭐⭐\t⭐⭐⭐⭐\n7\tiPhone 17 Pro Max\t⭐⭐⭐⭐⭐\t❌\t❌\t⭐⭐⭐⭐\t⭐⭐⭐⭐⭐\n8\tOppo Find X9 Ultra\t⭐⭐⭐⭐⭐\t❌\t❌\t⭐⭐⭐⭐⭐\t⭐⭐⭐⭐\n9\tHonor Magic 8 Pro\t⭐⭐⭐⭐⭐\t❌\t❌\t⭐⭐⭐⭐⭐\t⭐⭐⭐⭐\n10\tGoogle Pixel 10 Pro XL\t⭐⭐⭐⭐⭐\t❌\t❌\t⭐⭐⭐⭐\t⭐⭐⭐⭐\n\n🏆 The important distinction\n\nFor conventional photography:\nThe current flagship leaders are phones such as the iPhone 17 Pro Max and Galaxy S26 Ultra. TechRadar's September 2026 testing specifically highlights the iPhone for lifelike photos/video and the S26 Ultra for shooting flexibility and zoom.\n\nFor “I want one phone with unusual camera technologies”:\nThe Ulefone Armor 28 Ultra Thermal is much closer to what you've been describing. It combines a conventional flagship-style camera system with thermal imaging in a rugged phone. A 2026 Ulefone guide lists it with a 1-inch main sensor and thermal imaging.\n\nFor serious thermal + rugged use:\nThe Ulefone Armor 29 Pro Thermal is another specialist option, with a 640×512 thermal sensor according to current product information.\n\nFor night vision specifically:\nThe Ulefone Armor 34 is unusual. It has a 64MP infrared night-vision camera, four IR LEDs and a 50MP ultrawide/macro camera. It also has a gigantic 25,500mAh battery.\n\nFor thermal + very powerful hardware:\nThe 8849 TANK 5 Pro is another extreme option: 17,600mAh, Dimensity 9400e, three 50MP rear cameras, a FLIR Lepton 3.1R thermal camera, 2K laser projector and 120W charging.\n\n📸 If your goal is EXACTLY this:\n\n200MP/large sensor + realistic photos + powerful optical zoom + ultrawide + macro + thermal + true IR night vision + excellent video + long recording + huge storage + huge battery + rugged body\n\nthen don't choose a normal flagship. I'd narrow the search to the Ulefone Armor 28 Ultra Thermal, Armor 29 Pro Thermal, Armor 34, and 8849 TANK 5 Pro and compare their actual camera hardware one-by-one.\n\nAnd one important point: 200MP does not automatically mean better photos. Sensor size, optics, stabilization and image processing can matter more than megapixel count.","m":[]},{"x":"If you mean the top 10 smartphones for all-round photography in the world right now (September 2026)—daylight, realistic colors, portraits, night, ultrawide, zoom, close-ups, and video—these are the major contenders:\n\n#\tPhone\tMain strength\n\n1\tSamsung Galaxy S26 Ultra\tExtremely versatile still photography + zoom\n2\tOppo Find X9 Ultra\tHuge camera system, strong overall image quality\n3\tvivo X300 Ultra\tExcellent main camera + zoom\n4\tGoogle Pixel 11 Pro XL\tNatural-looking computational photography + portraits\n5\tApple iPhone 18 Pro Max\tExcellen /* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n>=1000?(n/1000).toFixed(1).replace('.0','')+'K':String(n);
const url=(p,f)=>RAW+(p.d||'')+f;
const ic=(id,c)=>`<svg class="ic${c?' '+c:''}"><use href="#i-${id}"/></svg>`;
const kindOf=p=>{const k=p.m.map(a=>a[0]);return k.includes('v')||k.includes('y')?'video':k.includes('i')?'photo':k.includes('l')?'link':'text'};
const imgsOf=p=>p.m.filter(a=>a[0]==='i').map(a=>url(p,a[1]));
function linkInfo(u){let h='',path='';try{const o=new URL(u);h=o.hostname.replace(/^www\./,'');path=o.pathname}catch(e){}
  if(h.endsWith('facebook.com'))return{name:path.includes('/r/')?'Facebook reel':'Facebook post',host:h,ch:'f'};
  if(h==='pin.it'||h.includes('pinterest'))return{name:'Pinterest pin',host:h,ch:'P'};
  return{name:h||'Link',host:h,ch:(h[0]||'L').toUpperCase()}}

function rich(s){
  return esc(s)
    .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])([#@][\p{L}\p{M}\p{N}_.]*[\p{L}\p{M}\p{N}_])/gu,'$1<span class="tag">$2</span>');
}
function table(rows){
  const th='<thead><tr>'+rows[0].map(c=>`<th>${esc(c)}</th>`).join('')+'</tr></thead>';
  const tb='<tbody>'+rows.slice(1).map(r=>'<tr>'+r.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>').join('')+'</tbody>';
  return `<div class="tw${rows[0].length>2?' wide':''}"><table>${th}${tb}</table></div>`;
}
function body(t){
  const L=t.split('\n');let out='',buf=[],tbl=[];
  const fT=()=>{if(tbl.length){out+=table(tbl);tbl=[]}};
  const fB=()=>{if(buf.length){out+='<div class="p">'+rich(buf.join('\n').replace(/^\n+|\n+$/g,''))+'</div>';buf=[]}};
  for(let i=0;i<L.length;i++){
    const l=L[i];
    if(l.includes('\t')){fB();tbl.push(l.split('\t').map(c=>c.trim()))}
    else if(!l.trim()&&tbl.length){let j=i+1;while(j<L.length&&!L[j].trim())j++;if(j<L.length&&L[j].includes('\t'))continue;fT();buf.push(l)}
    else{fT();buf.push(l)}
  }
  fT();fB();return out;
}

/* ---------- media blocks ---------- */
const single=s=>`<div class="media ph"><img class="pic" src="${esc(s)}" alt="Photo by ${ME.name}" loading="lazy" decoding="async"></div>`;
const gallery=u=>`<div class="media gal first"><div class="track">${u.map((s,i)=>`<div class="sl${i<2?' ph':''}"><img ${i<2?`src="${esc(s)}"`:`data-src="${esc(s)}"`} alt="Photo ${i+1} of ${u.length}" decoding="async" draggable="false"></div>`).join('')}</div><span class="cnt">1 / ${u.length}</span><div class="bar"><i style="width:${100/u.length}%"></i></div><button class="nv pv" data-nav="-1" aria-label="Previous photo">${ic('l')}</button><button class="nv nx" data-nav="1" aria-label="Next photo">${ic('r')}</button></div>`;
const video=s=>`<div class="media vid ph paused" data-src="${esc(s)}" data-o="${esc(s)}"><video muted loop playsinline preload="none"></video><span class="pp">${ic('p','f')}</span><button class="snd" data-act="snd" aria-label="Unmute">${ic('m')}</button></div>`;
const yt=id=>`<div class="media yt"><button data-yt="${esc(id)}" aria-label="Play video"><img src="https://i.ytimg.com/vi/${esc(id)}/hqdefault.jpg" alt="" loading="lazy" decoding="async"><span class="pp on">${ic('p','f')}</span></button></div>`;
const linkCard=u=>{const i=linkInfo(u);return `<a class="lk" href="${esc(u)}" target="_blank" rel="noopener noreferrer"><span class="lkb">${esc(i.ch)}</span><span class="lkt"><b>${esc(i.name)}</b><small>${esc(i.host)}</small></span>${ic('o')}</a>`};

function card(p,n){
  const k=kindOf(p),imgs=imgsOf(p),x=p.x||'';
  let mh='',run=[];
  const fl=()=>{if(run.length){mh+=run.length>1?gallery(run):single(run[0]);run=[]}};
  for(const [t,v] of p.m){
    if(t==='i')run.push(url(p,v));
    else{fl();mh+=t==='v'?video(url(p,v)):t==='y'?yt(v):linkCard(v)}
  }
  fl();
  const first=p.m[0],orig=!first?'':first[0]==='i'||first[0]==='v'?url(p,first[1]):first[0]==='y'?'https://youtu.be/'+first[1]:first[1];
  const meta=imgs.length>1?imgs.length+' photos':imgs.length===1?'Photo':p.m.some(a=>a[0]==='v')?'Video':p.m.some(a=>a[0]==='y')?'YouTube':p.m.some(a=>a[0]==='l')?linkInfo(p.m.find(a=>a[0]==='l')[1]).name:'Post';
  const bn=/[\u0980-\u09FF]/.test(x),clamp=x.length>320||x.includes('\t')||x.split('\n').length>9;
  return `<article class="post" id="p${n}" data-k="${k}"><div class="top"><span class="ring"><img src="${PHOTO}" alt="" width="40" height="40" decoding="async"></span><div><b>${ME.name}</b><small>${esc(meta)}</small></div></div>`
   +(x?`<div class="tx${bn?' bn':''}${clamp?' clamp':''}"${bn?' lang="bn"':''}>${body(x)}</div>${clamp?'<button class="more" data-act="more">See more</button>':''}`:'')
   +mh
   +`<div class="acts"><button class="like" data-act="like" aria-pressed="false" aria-label="Like">${ic('h')}</button><button data-act="share" aria-label="Share post">${ic('s')}</button>${orig?`<a class="ob" href="${esc(orig)}" target="_blank" rel="noopener noreferrer" aria-label="Open original">${ic('o')}</a>`:''}</div></article>`;
}

/* ---------- feed (renders in small batches so first paint is instant) ---------- */
const feed=$('#feed'),end=$('#end'),tabs=$('#tabs');
const auto=!matchMedia('(prefers-reduced-motion: reduce)').matches&&!(navigator.connection&&navigator.connection.saveData);
let view=[],shown=0,tab='all';
const BATCH=5;

const ioNear=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting)return;const w=e.target,v=w.firstChild;
  if(w.dataset.src){v.preload='metadata';v.src=w.dataset.src+'#t=0.001';delete w.dataset.src}
  ioNear.unobserve(w)}),{rootMargin:'700px 0px'});
const ioPlay=new IntersectionObserver(es=>es.forEach(e=>{
  const w=e.target,v=w.firstChild;
  if(e.intersectionRatio>=.6){if(auto&&!w._m)v.play().catch(()=>{})}
  else{w._m=false;v.pause()}}),{threshold:[0,.6]});

function render(){
  if(shown>=view.length){end.textContent=view.length?'No more posts.':'Nothing here yet.';return}
  const stop=Math.min(view.length,shown+BATCH);let h='';
  for(;shown<stop;shown++)h+=card(view[shown][0],view[shown][1]);
  end.insertAdjacentHTML('beforebegin',h);
  feed.querySelectorAll('.vid:not([data-w])').forEach(w=>{w.dataset.w=1;ioNear.observe(w);ioPlay.observe(w)});
  end.textContent=shown>=view.length?'No more posts.':'';
}
new IntersectionObserver(es=>{if(es[0].isIntersecting)render()},{rootMargin:'900px 0px'}).observe(end);

function setTab(t){
  tab=t;
  tabs.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
  feed.querySelectorAll('video').forEach(v=>v.pause());
  feed.querySelectorAll('.post').forEach(a=>a.remove());
  view=POSTS.map((p,i)=>[p,i+1]).filter(a=>t==='all'||kindOf(a[0])===t);
  shown=0;end.textContent='';
  if(scrollY>tabs.offsetTop)scrollTo(0,tabs.offsetTop);
  render();
}
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab');if(b&&b.dataset.t!==tab)setTab(b.dataset.t)});

/* ---------- gallery ---------- */
function galSync(t){
  const w=t.clientWidth||1,n=t.children.length,i=Math.min(n-1,Math.max(0,Math.round(t.scrollLeft/w))),g=t.parentNode;
  $('.cnt',g).textContent=(i+1)+' / '+n;$('.bar i',g).style.width=((i+1)/n*100)+'%';
  g.classList.toggle('first',i===0);g.classList.toggle('last',i===n-1);
  for(let j=Math.max(0,i-1);j<=Math.min(n-1,i+2);j++){const im=t.children[j].firstChild;if(im.dataset.src){t.children[j].classList.add('ph');im.src=im.dataset.src;delete im.dataset.src}}
}
feed.addEventListener('scroll',e=>{const t=e.target;if(!t.classList||!t.classList.contains('track')||t._r)return;t._r=requestAnimationFrame(()=>{t._r=0;galSync(t)})},true);

/* ---------- media events (load/error/play don't bubble, so capture) ---------- */
function bad(box,o){box.classList.remove('ph');box.classList.add('bad');if(!box.querySelector('.oops'))box.insertAdjacentHTML('beforeend',`<a class="oops" href="${esc(o)}" target="_blank" rel="noopener noreferrer">Couldn\u2019t load this. Open the original</a>`)}
feed.addEventListener('load',e=>{const t=e.target;if(t.tagName!=='IMG')return;const b=t.closest('.ph');if(b)b.classList.remove('ph');
  const g=t.closest('.gal');if(g&&!g.dataset.ar&&!t.parentNode.previousElementSibling&&t.naturalHeight){g.dataset.ar=1;g.style.setProperty('--ar',Math.min(1.91,Math.max(.8,t.naturalWidth/t.naturalHeight)))}},true);
feed.addEventListener('error',e=>{const t=e.target;
  if(t.tagName==='IMG'&&!t.closest('.yt')&&!t.closest('.ring'))bad(t.closest('.sl,.media'),t.currentSrc||t.dataset.src||'');
  else if(t.tagName==='VIDEO'){const w=t.parentNode;bad(w,w.dataset.o)}},true);
feed.addEventListener('loadedmetadata',e=>{const v=e.target;if(v.tagName!=='VIDEO')return;const w=v.parentNode;if(v.videoWidth)w.style.aspectRatio=v.videoWidth+'/'+v.videoHeight;w.classList.remove('ph')},true);
feed.addEventListener('play',e=>{if(e.target.tagName==='VIDEO')e.target.parentNode.classList.remove('paused')},true);
feed.addEventListener('pause',e=>{if(e.target.tagName==='VIDEO')e.target.parentNode.classList.add('paused')},true);

/* ---------- clicks ---------- */
const toast=(m)=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800)};
async function share(u,title){
  try{if(navigator.share){await navigator.share({title,url:u});return}await navigator.clipboard.writeText(u);toast('Link copied')}
  catch(e){if(e&&e.name!=='AbortError')toast(u)}
}
feed.addEventListener('click',e=>{
  const t=e.target;
  const nav=t.closest('[data-nav]');
  if(nav){const tr=$('.track',nav.parentNode);tr.scrollBy({left:nav.dataset.nav*tr.clientWidth,behavior:'smooth'});return}
  const act=t.closest('[data-act]');
  if(act){
    const a=act.dataset.act,post=act.closest('.post');
    if(a==='like'){const on=act.classList.toggle('on');act.setAttribute('aria-pressed',on)}
    else if(a==='share'){share(location.href.split('#')[0]+'#'+post.id,ME.name)}
    else if(a==='more'){const x=act.previousElementSibling,c=x.classList.toggle('clamp');act.textContent=c?'See more':'See less'}
    else if(a==='snd'){const w=act.closest('.vid'),v=w.firstChild;v.muted=!v.muted;act.innerHTML=ic(v.muted?'m':'v');act.setAttribute('aria-label',v.muted?'Unmute':'Mute');if(!v.muted&&v.paused){v.play().catch(()=>{})}}
    return;
  }
  const y=t.closest('[data-yt]');
  if(y){y.parentNode.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${y.dataset.yt}?autoplay=1&rel=0&playsinline=1" title="YouTube video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;return}
  const im=t.closest('.pic,.sl img');
  if(im){
    const post=im.closest('.post'),p=POSTS[post.id.slice(1)-1],sl=im.closest('.sl');
    openLB(imgsOf(p),sl?[...sl.parentNode.children].indexOf(sl):0);return}
  const vw=t.closest('.vid');
  if(vw&&!t.closest('a')){const v=vw.firstChild;if(v.paused){v.play().catch(()=>{})}else{vw._m=true;v.pause()}}
});

/* ---------- lightbox ---------- */
const lb=$('#lb'),lbi=$('img',lb);let LB={a:[],i:0},tx=0;
function showLB(){const n=LB.a.length;lbi.src=LB.a[LB.i];$('#lc').textContent=n>1?(LB.i+1)+' / '+n:'';$('.lp',lb).hidden=$('.ln',lb).hidden=n<2;
  [1,-1].forEach(d=>{const s=LB.a[LB.i+d];if(s)new Image().src=s})}
function openLB(a,i){LB={a,i};showLB();lb.hidden=false;document.body.style.overflow='hidden';$('.x',lb).focus()}
function closeLB(){lb.hidden=true;lbi.removeAttribute('src');document.body.style.overflow=''}
function stepLB(d){const n=LB.a.length;if(n<2)return;LB.i=(LB.i+d+n)%n;showLB()}
lb.addEventListener('click',e=>{if(e.target.closest('.x')||e.target===lb||e.target===lbi&&false)closeLB();else if(e.target.closest('.lp'))stepLB(-1);else if(e.target.closest('.ln'))stepLB(1)});
lb.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)stepLB(d<0?1:-1)},{passive:true});
addEventListener('keydown',e=>{if(lb.hidden)return;if(e.key==='Escape')closeLB();else if(e.key==='ArrowLeft')stepLB(-1);else if(e.key==='ArrowRight')stepLB(1)});
$('#ava').addEventListener('click',()=>openLB([PHOTO],0));

/* ---------- profile ---------- */
$('#s-p').textContent=fmt(POSTS.length);
$('#s-i').textContent=fmt(POSTS.reduce((s,p)=>s+p.m.filter(a=>a[0]==='i').length,0));
$('#s-v').textContent=fmt(POSTS.reduce((s,p)=>s+p.m.filter(a=>a[0]==='v'||a[0]==='y').length,0));
$('#sharep').addEventListener('click',()=>share(location.href.split('#')[0],ME.name));

setTab('all');
const hm=location.hash.match(/^#p(\d+)$/);
if(hm){const n=+hm[1];while(shown<view.length&&shown<n)render();requestAnimationFrame(()=>{const el=document.getElementById('p'+n);if(el)el.scrollIntoView()})}
})();
</script>
</body>
</html>
